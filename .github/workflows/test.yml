name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs the node and pnpm versions pinned in mise.toml
      - name: Setup mise
        uses: jdx/mise-action@v5

      # Native modules in node_modules are built for one exact runner image.
      - name: Compute runner image cache id
        shell: bash
        run: echo "RUNNER_IMAGE_ID=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ env.RUNNER_IMAGE_ID }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: pnpm ci

      - name: Run tests
        run: pnpm test:run

      - name: Build project
        run: pnpm build
