name: Publish to NPM

on:
  push:
    tags:
      - 'v*' # Run on any tag that starts with v (e.g., v1.0.0)


permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs the node and pnpm versions pinned in mise.toml
      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm ci

      # release.sh already bumps package.json to the tag version, so allow it to be unchanged
      - name: Update package version
        run: |
          pnpm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build package
        run: pnpm build

      # --no-git-checks because the version bump above leaves the tree dirty
      - name: Publish package
        run: pnpm publish --access public --no-git-checks
