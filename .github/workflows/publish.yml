name: Publish to NPM

on:
  push:
    tags:
      - 'v*' # Run on any tag that starts with v (e.g., v1.0.0)


permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs the node and pnpm versions pinned in mise.toml
      - name: Setup mise
        uses: jdx/mise-action@v5

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest

      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # release.sh already bumps package.json to the tag version, so allow it to be unchanged
      - name: Update package version
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build package
        run: pnpm build

      # Same registry config actions/setup-node wrote via `registry-url`:
      # OIDC trusted publishing first, with NPM_TOKEN as the fallback.
      - name: Configure npm registry
        run: |
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> $GITHUB_ENV
          cat > "$RUNNER_TEMP/.npmrc" <<'EOF'
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          registry=https://registry.npmjs.org/
          EOF

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
